<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="description" content="CRM compartilhado para empresas de marketing e desenvolvimento. Clientes, vendas, projetos e financeiro em um só lugar.">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nexo CRM">
<meta name="robots" content="noindex,nofollow">
<title>Nexo CRM Mono · Sua equipe, conectada</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
<a class="skip-link" href="#main">Ir para o conteúdo</a>
<div id="pwa-network-banner" class="pwa-network-banner" role="status" aria-live="polite" hidden></div>
<div id="app"><main class="fatal"><h1>Nexo CRM Equipe</h1><p>Conectando ao seu espaço de trabalho…</p></main></div>
<dialog id="editor" aria-labelledby="dialog-title"></dialog>
<dialog id="search-dialog" aria-labelledby="search-title"></dialog>
<div id="toasts" class="toasts" role="status" aria-live="polite" aria-atomic="true"></div>
<div id="print-area"></div>
<input type="file" id="backup-file" accept=".json,application/json" hidden>
<input type="file" id="csv-file" accept=".csv,text/csv" hidden>
<input type="file" id="bos-file" accept=".pdf,.docx,.xlsx,.csv,.jpg,.jpeg,.png,.webp,.svg,.mp4,.mov,.zip,.pptx,.txt" hidden>
<noscript><div class="fatal">Ative o JavaScript do navegador para usar o Nexo CRM. Os dados são armazenados no servidor da empresa.</div></noscript>
<script src="/assets/pwa.js" defer></script>
<script src="/assets/app.js" defer></script>
</body>
</html>
