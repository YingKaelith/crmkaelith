name: nexo-crm
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${NEXO_DB_ADMIN_PASSWORD:?Gere deploy/.env antes de iniciar}
      NEXO_DB_PASSWORD: ${NEXO_DB_PASSWORD:?Gere a senha da aplicação}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./01-init-database.sh:/docker-entrypoint-initdb.d/01-nexo.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexo"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment: &app-env
      NEXO_ENV: production
      NEXO_ORIGIN: https://${NEXO_DOMAIN:?Informe o domínio em deploy/.env}
      NEXO_SETUP_TOKEN: ${NEXO_SETUP_TOKEN:?Gere o código de instalação}
      DATABASE_URL: postgresql+psycopg://nexo:${NEXO_DB_PASSWORD}@db:5432/nexo
      NEXO_DATA_DIR: /var/lib/nexo
    volumes:
      - application-data:/var/lib/nexo
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request,urllib.parse; h=urllib.parse.urlsplit(os.environ['NEXO_ORIGIN']).netloc; r=urllib.request.Request('http://127.0.0.1:8000/api/health',headers={'Host':h}); urllib.request.urlopen(r,timeout=4)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [private, edge]
    # Sem porta publicada: somente o proxy alcança a API de fora do host.

  backup:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backup
    restart: unless-stopped
    environment: *app-env
    volumes:
      - application-data:/var/lib/nexo
    depends_on:
      app: {condition: service_healthy}
    networks: [private]

  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      NEXO_DOMAIN: ${NEXO_DOMAIN}
      NEXO_TLS_EMAIL: ${NEXO_TLS_EMAIL:?Informe o contato técnico para TLS}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app: {condition: service_healthy}
    networks: [edge]

volumes:
  postgres-data:
  application-data:
  caddy-data:
  caddy-config:
networks:
  private: {internal: true}
  edge:
